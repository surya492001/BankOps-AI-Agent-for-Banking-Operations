services:
  postgres:
    image: postgres:16
    container_name: bankops-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: bankops
      POSTGRES_USER: bankops
      POSTGRES_PASSWORD: opsfde
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
